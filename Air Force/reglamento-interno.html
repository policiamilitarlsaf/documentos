<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reglamento Interno · Fuerza Aérea</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
    }

    input, textarea {
      user-select: text;
      -webkit-user-select: text;
    }

    @page {
      size: A4;
      margin: 0;
    }

    body {
      background-color: #2c3e4e;
      font-family: 'Roboto', 'Segoe UI', sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 0;
      margin: 0;
    }

    .manual {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
    }

    .page {
      width: 210mm;
      min-height: 297mm;
      height: auto;
      background: #f5f7fc;
      position: relative;
      padding: 8mm 12mm 8mm 12mm;
      display: flex;
      flex-direction: column;
      page-break-after: always;
      break-inside: avoid;
      box-shadow: 0 0 0 1px rgba(0,0,0,0.1);
      margin-bottom: 5mm;
      background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" opacity="0.02"><path fill="%23336699" d="M50 15 L70 35 L65 55 L50 70 L35 55 L30 35 Z M50 30 L60 40 L55 55 L50 62 L45 55 L40 40 Z" /></svg>');
      background-repeat: repeat;
      background-size: 60px 60px;
    }

    @media print {
      body {
        background: white;
      }
      .page {
        box-shadow: none;
        border: none;
        background-image: none;
        margin-bottom: 0;
        page-break-after: always;
        break-inside: avoid;
      }
      body::before {
        content: "Documento Protegido - Impresión no autorizada";
        display: block;
        text-align: center;
        background: red;
        color: white;
        padding: 10px;
        font-size: 14px;
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        z-index: 9999;
      }
    }

    .page-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 4mm;
      border-bottom: 2px solid #c4a747;
      padding-bottom: 3mm;
      flex-shrink: 0;
    }
    .logo-airforce {
      height: 40px;
      width: auto;
      pointer-events: none;
      object-fit: contain;
    }
    .header-title {
      font-family: 'Oswald', sans-serif;
      font-size: 14pt;
      color: #1f6392;
      letter-spacing: 1px;
      text-transform: uppercase;
      font-weight: 500;
    }

    .page-content {
      flex: 1 0 auto;
      overflow: visible;
    }

    .page-footer {
      flex-shrink: 0;
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      margin-top: 5mm;
      border-top: 1px dashed #c4a747;
      padding-top: 3mm;
      font-family: 'Oswald', sans-serif;
      color: #5a7d9a;
      font-size: 9pt;
    }
    .footer-note {
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .page-number {
      font-weight: 700;
      color: #1f6392;
    }

    .section-title {
      font-family: 'Oswald', sans-serif;
      font-weight: 700;
      font-size: 22pt;
      text-transform: uppercase;
      color: #1f4b6e;
      border-left: 8px solid #c4a747;
      padding-left: 12px;
      margin: 2mm 0 4mm 0;
      border-bottom: 2px solid #c4a747;
      padding-bottom: 4px;
    }

    .subsection-title {
      font-family: 'Oswald', sans-serif;
      font-weight: 600;
      font-size: 16pt;
      color: #1f6392;
      margin: 3mm 0 2mm 0;
      border-left: 5px solid #c4a747;
      padding-left: 10px;
    }

    .text-block {
      background: white;
      border-radius: 10px;
      padding: 3mm 4mm;
      margin-bottom: 3mm;
      box-shadow: 0 1px 4px rgba(0,0,0,0.05);
      border: 1px solid #e2ecf5;
    }

    .info-label {
      font-size: 9.5pt;
      font-weight: 700;
      text-transform: uppercase;
      color: #2c7aa0;
      letter-spacing: 0.5px;
      margin-bottom: 2mm;
      display: block;
    }

    .info-text {
      font-size: 10.5pt;
      line-height: 1.4;
      color: #1f3e54;
      text-align: justify;
    }

    .highlight-box {
      background: #fefcf5;
      border-left: 4px solid #c4a747;
      padding: 3mm 4mm;
      margin: 2.5mm 0;
      border-radius: 8px;
    }

    /* cuadrícula de rangos - completamente responsiva y sin desbordes */
    .rank-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(110px, 1fr));
      gap: 6mm 4mm;
      margin: 5mm 0 4mm;
    }
    .rank-item {
      text-align: center;
      background: white;
      border-radius: 12px;
      padding: 3mm 2mm;
      box-shadow: 0 2px 6px rgba(0,0,0,0.05);
      border: 1px solid #e0ebf2;
      transition: all 0.1s ease;
    }
    .rank-item img {
      max-width: 100%;
      height: auto;
      max-height: 55px;
      width: auto;
      object-fit: contain;
      margin-bottom: 3px;
      pointer-events: none;
    }
    .rank-name {
      font-weight: 700;
      font-size: 10pt;
      margin-top: 4px;
      color: #1f4b6e;
    }
    .rank-code {
      font-size: 9pt;
      color: #5f7f9e;
      font-family: monospace;
      font-weight: 500;
    }

    .article-title {
      font-family: 'Oswald', sans-serif;
      font-size: 15pt;
      font-weight: 600;
      color: #1f6392;
      margin: 5mm 0 2mm 0;
      background: rgba(196, 167, 71, 0.1);
      padding: 2mm 6px;
      border-radius: 8px;
    }

    .cover-logos {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 15mm;
      margin: 6mm 0 10mm;
      flex-wrap: wrap;
    }
    .cover-logos img {
      height: 70px;
      width: auto;
      pointer-events: none;
      object-fit: contain;
    }
    .cover-title {
      text-align: center;
      margin-top: 6mm;
    }
    .cover-title h1 {
      font-family: Oswald;
      font-size: 42pt;
      margin: 3mm 0;
      color: #1f4b6e;
      letter-spacing: 2px;
    }
    
    .golden-rule {
      background: #fff8e7;
      border: 2px solid #c4a747;
      border-radius: 20px;
      padding: 4mm 5mm;
      text-align: center;
      margin: 4mm 0;
    }
    
    .signature-box {
      border: 2px solid #c4a747;
      width: 70mm;
      margin: 8mm auto 5mm;
      padding: 5mm;
      text-align: center;
      background-color: #fefcf5;
      border-radius: 8px;
    }
    
    .small-print {
      font-size: 8pt;
      text-align: center;
      margin-top: 10mm;
      color: #6c8dae;
      border-top: 0.5px dashed #c4a747;
      padding-top: 4mm;
      width: 100%;
    }
    
    ::selection {
      background: transparent;
    }
    
    p, h1, h2, h3, h4, span, div {
      user-select: none;
      -webkit-user-select: none;
    }

    .inline-img {
      max-width: 100%;
      margin: 2mm 0;
      border-radius: 8px;
    }
    
    /* tablas auxiliares */
    .metar-table {
      width: 100%;
      border-collapse: collapse;
      margin: 2mm 0;
    }
    .metar-table td {
      vertical-align: top;
      padding: 2mm;
      border: 1px solid #d4e0ea;
      background: white;
    }

    /* Ajuste para evitar cualquier desborde horizontal */
    img, svg {
      max-width: 100%;
      height: auto;
    }
    .page-content {
      overflow-x: hidden;
    }
  </style>
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
</head>
<body>
<div class="manual" id="manualContainer"></div>

<script>
    // ============================================
    // REGLAMENTO INTERNO · CONTENIDO UNIFORME
    // ============================================
    const contentSections = [];
    
    function addSection(htmlContent, isPageBreak = false) {
        contentSections.push({ html: htmlContent, forcePageBreak: isPageBreak });
    }
    
    // ========== PORTADA ==========
    addSection(`
        <div class="cover-logos">
            <img src="https://i.imgur.com/GfmYqNX.png" alt="Air Force Seal" style="height:75px;">
            <img src="https://i.imgur.com/wioFUxA.png" alt="AETC" style="height:75px;">
        </div>
        <div class="cover-title">
            <h1>REGLAMENTO INTERNO</h1>
            <div style="height: 2px; background: #c4a747; width: 60%; margin: 5mm auto;"></div>
            <p style="font-size: 14pt; margin-top: 8mm;"><span style="background: #1f4b6e; color: white; padding: 4px 20px; border-radius: 40px;">AERO GUARDIANS SQUADRON</span></p>
            <p style="font-size: 12pt; margin-top: 8mm;">Normas, principios y organización de la unidad de élite</p>
            <p style="font-size: 10pt; margin-top: 12mm; color:#2c7aa0;">Edición Oficial · Comando de Educación y Doctrina Aérea</p>
        </div>
    `, true);
    
    // ========== REGLAMENTO INTERNO · MISIÓN Y VALORES ==========
    addSection(`
        <div class="section-title">Fundamentos del Escuadrón</div>
        <div class="text-block">
            <span class="info-label">✈️ AERO GUARDIANS SQUADRON</span>
            <div class="info-text">El Aero Guardians Squadron es una unidad de élite de la Fuerza Aérea de los Estados Unidos, concebida para integrar cuatro pilares esenciales: acrobacias aéreas de alto rendimiento, logística integral de aeronaves, ensayos aeroespaciales avanzados y control de tráfico aéreo militar (ATC). Este reglamento interno establece las normas, valores y procedimientos que rigen la conducta de todos sus miembros.</div>
        </div>
        <div class="subsection-title">Misión</div>
        <div class="highlight-box">
            <div class="info-text">Garantizar la superioridad aérea y aeroespacial mediante la ejecución de maniobras de precisión, soporte logístico avanzado, ensayos experimentales y servicios de control de tráfico aéreo militar con los más altos estándares de seguridad y eficacia.</div>
        </div>
        <div class="subsection-title">Visión</div>
        <div class="highlight-box">
            <div class="info-text">Convertirse en el escuadrón insignia de innovación y excelencia de la Fuerza Aérea, liderando en exhibiciones aéreas, soporte logístico de última generación, proyectos aeroespaciales de vanguardia y gestión del espacio aéreo militar.</div>
        </div>
        <div class="subsection-title">Valores fundamentales</div>
        <div class="text-block">
            <div class="info-text">
                <strong>⚡ Disciplina:</strong> Cumplimiento irrestricto de procedimientos.<br>
                <strong>⚡ Honor:</strong> Representar con orgullo a la Fuerza Aérea y la nación.<br>
                <strong>⚡ Excelencia:</strong> Superación constante en cada misión.<br>
                <strong>⚡ Trabajo en equipo:</strong> Cohesión entre pilotos, técnicos y controladores.<br>
                <strong>⚡ Innovación:</strong> Desarrollo de nuevas tácticas y tecnologías.
            </div>
        </div>
        <div class="info-text"><strong>Nota reglamentaria:</strong> Todo miembro del escuadrón se compromete a respetar estos valores. La violación reiterada será sujeta a procesos disciplinarios según el código de conducta militar.</div>
    `);
    
    // ========== PILARES Y ROLES ==========
    addSection(`
        <div class="section-title">Pilares y Roles</div>
        <div class="text-block">
            <span class="info-label">⚙️ ESTRUCTURA MULTIFUNCIONAL</span>
            <div class="info-text">
                <strong>✈️ Acrobacias aéreas:</strong> Ejecución de maniobras de precisión en exhibiciones y entrenamiento táctico.<br>
                <strong>🔧 Logística de aeronaves:</strong> Mantenimiento, abastecimiento y disponibilidad operativa 24/7.<br>
                <strong>🚀 Ensayos aeroespaciales (Apollo):</strong> Pruebas de aeronaves experimentales y proyectos de nueva generación.<br>
                <strong>📡 Control de tráfico aéreo (ATC):</strong> Gestión del espacio aéreo militar, coordinación y seguridad de vuelo.
            </div>
        </div>
        <div class="highlight-box">
            <span class="info-label">📌 INTEGRACIÓN OPERACIONAL</span>
            <div class="info-text">Todos los miembros deben comprender la interdependencia de los cuatro pilares. Un piloto de acrobacias coordinará con logística para el estado de la aeronave, con ensayos para implementar nuevas tecnologías y con ATC para operar en espacio controlado, manteniendo siempre los principios de disciplina y excelencia.</div>
        </div>
        <div class="subsection-title">Compromiso de conducta</div>
        <div class="text-block">
            <div class="info-text">Cada integrante del Aero Guardians Squadron actuará bajo la cadena de mando establecida, respetando las órdenes de superiores, fomentando el respeto mutuo y protegiendo la información clasificada. El incumplimiento de estas normas será documentado y evaluado por el Consejo de Ética del escuadrón.</div>
        </div>
    `);
    
    // ========== ESCALAFÓN DE LA FUERZA AÉREA (TAMAÑOS UNIFORMES) ==========
    addSection(`
        <div class="section-title">Jerarquía y Escalafón</div>
        <div class="text-block">
            <span class="info-label">🎖️ RANGOS US AIR FORCE</span>
            <div class="info-text">El Aero Guardians Squadron adopta la estructura jerárquica oficial de la Fuerza Aérea de los Estados Unidos. Cada rango define responsabilidades claras y líneas de autoridad.</div>
        </div>
        
        <div class="article-title">Oficiales (Officer Corps)</div>
        <div class="rank-grid">
            <div class="rank-item"><img src="https://i.imgur.com/Z7UrqZR.png" alt="O-1"><div class="rank-name">Teniente Segundo</div><div class="rank-code">O-1</div></div>
            <div class="rank-item"><img src="https://i.imgur.com/PbQpOhy.png" alt="O-2"><div class="rank-name">Teniente Primero</div><div class="rank-code">O-2</div></div>
            <div class="rank-item"><img src="https://i.imgur.com/3gnlf6R.png" alt="O-3"><div class="rank-name">Capitán</div><div class="rank-code">O-3</div></div>
            <div class="rank-item"><img src="https://i.imgur.com/wSpJHRv.png" alt="O-4"><div class="rank-name">Mayor</div><div class="rank-code">O-4</div></div>
            <div class="rank-item"><img src="https://i.imgur.com/zimQ6Gm.png" alt="O-5"><div class="rank-name">Teniente Coronel</div><div class="rank-code">O-5</div></div>
            <div class="rank-item"><img src="https://i.imgur.com/zIAp0ji.png" alt="O-6"><div class="rank-name">Coronel</div><div class="rank-code">O-6</div></div>
            <div class="rank-item"><img src="https://i.imgur.com/fL6NKVI.png" alt="O-7"><div class="rank-name">Brigadier General</div><div class="rank-code">O-7</div></div>
            <div class="rank-item"><img src="https://i.imgur.com/VWQpqSJ.png" alt="O-8"><div class="rank-name">Mayor General</div><div class="rank-code">O-8</div></div>
            <div class="rank-item"><img src="https://i.imgur.com/7mzIHBW.png" alt="O-9"><div class="rank-name">Teniente General</div><div class="rank-code">O-9</div></div>
            <div class="rank-item"><img src="https://i.imgur.com/YzdiuVz.png" alt="O-10"><div class="rank-name">General</div><div class="rank-code">O-10</div></div>
        </div>

        <div class="article-title">Suboficiales (NCO Corps)</div>
        <div class="rank-grid">
            <div class="rank-item"><img src="https://i.imgur.com/bskM1y0.png" alt="E-5"><div class="rank-name">Sargento de Personal</div><div class="rank-code">E-5</div></div>
            <div class="rank-item"><img src="https://i.imgur.com/GHVRcFR.png" alt="E-6"><div class="rank-name">Sargento Técnico</div><div class="rank-code">E-6</div></div>
            <div class="rank-item"><img src="https://i.imgur.com/lRq48UN.png" alt="E-7"><div class="rank-name">Sargento Maestre</div><div class="rank-code">E-7</div></div>
            <div class="rank-item"><img src="https://i.imgur.com/7a7FRvs.png" alt="E-8"><div class="rank-name">Sargento Maestre Mayor</div><div class="rank-code">E-8</div></div>
            <div class="rank-item"><img src="https://i.imgur.com/ocSFYgu.png" alt="E-9"><div class="rank-name">Sargento Maestre de la Fuerza Aérea</div><div class="rank-code">E-9</div></div>
            <div class="rank-item"><img src="https://i.imgur.com/6V94YHP.png" alt="E-10"><div class="rank-name">Suboficial Mayor de la Fuerza Aérea</div><div class="rank-code">E-10</div></div>
        </div>

        <div class="article-title">Tropa Alistada (Enlisted)</div>
        <div class="rank-grid">
            <div class="rank-item"><img src="https://i.imgur.com/pEwQxQg.png" alt="E-2"><div class="rank-name">Aviador</div><div class="rank-code">E-2</div></div>
            <div class="rank-item"><img src="https://i.imgur.com/OVq2YgY.png" alt="E-3"><div class="rank-name">Aviador de Primera</div><div class="rank-code">E-3</div></div>
            <div class="rank-item"><img src="https://i.imgur.com/rbU3o16.png" alt="E-4"><div class="rank-name">Aviador Mayor</div><div class="rank-code">E-4</div></div>
        </div>

        <div class="highlight-box">
            <span class="info-label">📌 CADENA DE MANDO</span>
            <div class="info-text">El respeto por los rangos y la cadena de mando es obligatorio. Todo miembro deberá dirigirse a sus superiores según el protocolo militar, fomentando un ambiente de liderazgo profesional. Los ascensos se basarán en méritos, evaluación continua y cumplimiento de estándares de vuelo/logísticos.</div>
        </div>
    `);
    
    // ========== NORMAS DE SEGURIDAD Y PROCEDIMIENTO ==========
    addSection(`
        <div class="section-title">Normas de Seguridad</div>
        <div class="text-block">
            <span class="info-label">🛡️ REGLAMENTO DE VUELO Y TIERRA</span>
            <div class="info-text">La seguridad operacional es prioridad absoluta dentro del Aero Guardians Squadron. Todo el personal debe cumplir estrictamente los procedimientos estandarizados, reportar condiciones peligrosas y utilizar el equipo de protección correspondiente según el área de trabajo.</div>
        </div>
        <div class="subsection-title">Prohibiciones generales</div>
        <div class="highlight-box">
            <div class="info-text">
                • Queda prohibido el uso de dispositivos móviles no autorizados en zonas de vuelo y control.<br>
                • Ningún miembro podrá manipular sistemas aeronáuticos sin la debida certificación.<br>
                • El consumo de alcohol o sustancias prohibidas durante el servicio conllevará baja inmediata.<br>
                • No se tolerará ninguna acción que comprometa la seguridad de las operaciones aéreas.
            </div>
        </div>
        <div class="subsection-title">Procedimiento ante emergencias</div>
        <div class="text-block">
            <div class="info-text">Ante cualquier emergencia aérea o terrestre, se activará el protocolo de respuesta inmediata: notificar a Torre de Control, evacuar zonas de riesgo según plan de contingencia y reportar al oficial de guardia. Todos los miembros recibirán entrenamiento semestral en simulacros.</div>
        </div>
        <div class="info-text"><strong>Sanción por incumplimiento:</strong> Las faltas leves serán sancionadas con apercibimiento escrito; las graves, con suspensión temporal; y las muy graves, con expulsión del escuadrón y posible baja de la Fuerza Aérea.</div>
    `);
    
    // ========== DERECHOS Y DEBERES ==========
    addSection(`
        <div class="section-title">Derechos y Deberes</div>
        <div class="text-block">
            <span class="info-label">⚖️ CÓDIGO DE CONDUCTA INTERNO</span>
            <div class="info-text"><strong>Deberes:</strong> Todo miembro debe cumplir con las órdenes de sus superiores, mantener en óptimas condiciones su equipo y aeronave asignada, participar en entrenamientos periódicos y custodiar la información clasificada. Asimismo, velar por el buen nombre del escuadrón dentro y fuera de la base.</div>
        </div>
        <div class="text-block">
            <div class="info-text"><strong>Derechos:</strong> Recibir formación continua, ser evaluado justamente, gozar de períodos de descanso reglamentarios y acceder a canales formales para presentar sugerencias o quejas sin represalias. Todo derecho está sujeto al cumplimiento de las obligaciones militares.</div>
        </div>
        <div class="highlight-box">
            <span class="info-label">📢 CANAL DE DENUNCIAS</span>
            <div class="info-text">Se habilita la Oficina de Asuntos Internos del escuadrón para recibir reportes confidenciales sobre violaciones al reglamento. El anonimato será garantizado en todos los casos.</div>
        </div>
        <div class="info-text"><strong>Ejemplo práctico:</strong> Un Sargento Técnico que detecte una irregularidad en el mantenimiento de una aeronave tiene el deber de reportarla de inmediato a su superior directo o al oficial de seguridad. No hacerlo constituye falta grave.</div>
    `);
    
    // ========== RÉGIMEN DISCIPLINARIO ==========
    addSection(`
        <div class="section-title">Régimen Disciplinario</div>
        <div class="text-block">
            <span class="info-label">⚙️ FALTAS Y SANCIONES</span>
            <div class="info-text"><strong>Faltas leves:</strong> Retrasos injustificados, descuido leve en uniforme, omisión de reportes menores. Sanción: amonestación verbal o escrita.</div>
            <div class="info-text" style="margin-top: 2mm;"><strong>Faltas graves:</strong> Desobediencia parcial, negligencia en tareas operativas, divulgación no autorizada de datos no clasificados. Sanción: suspensión de hasta 15 días y pérdida de privilegios.</div>
            <div class="info-text" style="margin-top: 2mm;"><strong>Faltas muy graves:</strong> Actos de insubordinación, sabotaje, filtración de información secreta, violencia o acoso. Sanción: expulsión inmediata del escuadrón y remisión al Tribunal Militar.</div>
        </div>
        <div class="subsection-title">Procedimiento sancionador</div>
        <div class="highlight-box">
            <div class="info-text">Todo proceso disciplinario será iniciado mediante informe firmado por un superior directo. Se concederá al implicado un plazo de 48 horas para presentar descargos. El Consejo de Disciplina emitirá resolución en un plazo máximo de 10 días hábiles.</div>
        </div>
        <div class="info-text">El presente reglamento entra en vigor desde su publicación y deroga cualquier normativa interna anterior. Todo miembro debe firmar una declaración de conocimiento al ingresar al escuadrón.</div>
    `);
    
    // ========== CIERRE Y FIRMAS ==========
    addSection(`
        <div style="text-align: center; margin-top: 15mm;">
            <div style="font-size: 42pt; font-family: Oswald; color: #1f6392;">★ ★ ★</div>
            <p style="font-size: 26pt; font-family: Oswald; margin: 4mm 0 2mm; color: #1f4b6e;">REGLAMENTO INTERNO</p>
            <p style="font-size: 14pt; max-width: 140mm; margin: 0 auto; font-style: italic; color: #2c7aa0;">"La disciplina y el honor forjan la excelencia aérea"</p>
            <div class="signature-box">
                <p style="font-family: Oswald; font-size: 14pt; margin-bottom: 3mm;">Alto Mando Aéreo</p>
                <img src="https://i.imgur.com/gyQC992.png" alt="Firma oficial" style="max-width: 55mm; height: auto; display: block; margin: 0 auto;">
                <p style="font-family: Oswald; font-size: 11pt; margin-top: 2mm;">General de División</p>
                <p style="font-size: 8pt;">Comandante del Aero Guardians Squadron</p>
            </div>
            <div class="small-print">Este documento es de uso oficial exclusivo para miembros del escuadrón. Prohibida su reproducción total o parcial.<br>Revisión 2.0 · Vigencia indefinida.</div>
        </div>
    `);
    
    // ============================================
    // PAGINADO AUTOMÁTICO (AJUSTE DE ALTURA PRECISO)
    // ============================================
    function buildPages() {
        const container = document.getElementById('manualContainer');
        container.innerHTML = '';
        
        const pageHeightMM = 297;
        const topMargin = 8;
        const bottomMargin = 8;
        const headerHeight = 13; 
        const footerHeight = 11;
        const availableHeightMM = pageHeightMM - topMargin - bottomMargin - headerHeight - footerHeight;
        const mmToPx = 3.78;
        const maxContentHeightPx = availableHeightMM * mmToPx;
        
        let currentPage = null;
        let currentPageContent = null;
        let currentHeight = 0;
        let pageCounter = 1;
        
        function measureHeight(html) {
            const temp = document.createElement('div');
            temp.style.position = 'absolute';
            temp.style.visibility = 'hidden';
            temp.style.width = '186mm';
            temp.style.padding = '0';
            temp.style.margin = '0';
            temp.style.fontFamily = 'Roboto, sans-serif';
            temp.innerHTML = html;
            document.body.appendChild(temp);
            const height = temp.offsetHeight;
            document.body.removeChild(temp);
            return height;
        }
        
        function createNewPage() {
            const pageDiv = document.createElement('div');
            pageDiv.className = 'page';
            
            const header = document.createElement('div');
            header.className = 'page-header';
            header.innerHTML = `
                <img src="https://i.imgur.com/GfmYqNX.png" alt="Air Force" class="logo-airforce">
                <span class="header-title">Reglamento Interno · Aero Guardians</span>
                <img src="https://i.imgur.com/GfmYqNX.png" alt="Air Force" class="logo-airforce" style="opacity:0.8;">
            `;
            
            const content = document.createElement('div');
            content.className = 'page-content';
            
            const footer = document.createElement('div');
            footer.className = 'page-footer';
            footer.innerHTML = `
                <span class="footer-note">Fuerza Aérea · Documento Normativo Oficial</span>
                <span class="page-number">${pageCounter}</span>
            `;
            
            pageDiv.appendChild(header);
            pageDiv.appendChild(content);
            pageDiv.appendChild(footer);
            container.appendChild(pageDiv);
            
            currentPage = pageDiv;
            currentPageContent = content;
            currentHeight = 0;
            pageCounter++;
            
            return { pageDiv, contentDiv: content };
        }
        
        function addToPage(html) {
            if (!currentPage) createNewPage();
            const sectionHeight = measureHeight(html);
            if (currentHeight + sectionHeight > maxContentHeightPx && currentHeight > 30) {
                createNewPage();
            }
            const wrapper = document.createElement('div');
            wrapper.innerHTML = html;
            currentPageContent.appendChild(wrapper);
            currentHeight += sectionHeight;
        }
        
        for (let i = 0; i < contentSections.length; i++) {
            const section = contentSections[i];
            addToPage(section.html);
            if (section.forcePageBreak && i < contentSections.length - 1) {
                createNewPage();
                currentHeight = 0;
            }
        }
    }
    
    // ============================================
    // SEGURIDAD Y BLOQUEOS
    // ============================================
    document.addEventListener('contextmenu', function(e) { e.preventDefault(); return false; });
    document.addEventListener('keydown', function(e) {
        if (e.key === 'F12' || (e.ctrlKey && e.shiftKey && (e.key === 'I' || e.key === 'i' || e.key === 'J' || e.key === 'j' || e.key === 'C' || e.key === 'c')) || (e.ctrlKey && (e.key === 'U' || e.key === 'u' || e.key === 'S' || e.key === 's' || e.key === 'P' || e.key === 'p'))) {
            e.preventDefault(); return false;
        }
        if (e.key === 'ContextMenu' || e.keyCode === 93) { e.preventDefault(); return false; }
    });
    window.addEventListener('dragstart', function(e) { e.preventDefault(); return false; });
    document.onselectstart = function() { return false; };
    document.body.addEventListener('copy', function(e) { e.preventDefault(); return false; });
    document.body.addEventListener('cut', function(e) { e.preventDefault(); return false; });
    
    window.addEventListener('DOMContentLoaded', function() {
        buildPages();
        const allImages = document.querySelectorAll('img');
        allImages.forEach(img => {
            img.addEventListener('contextmenu', function(e) { e.preventDefault(); return false; });
            img.addEventListener('dragstart', function(e) { e.preventDefault(); return false; });
        });
    });
    
    console.log('%c📘 REGLAMENTO INTERNO - DOCUMENTO CONFIDENCIAL 🚫', 'color: #c4a747; font-size: 14px; font-weight: bold;');
</script>
